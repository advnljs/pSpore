appId: com.pspore.desktop
productName: pSpore
directories:
  output: release-dist/electron-out
files:
  - dist/**/*
  - package.json
extraMetadata:
  main: dist/desktop/main.js
asar: true
# Bundled skills are symlinked into the workspace and may carry native helper
# binaries, neither of which works from inside the archive.
asarUnpack:
  - dist/bundled-skills/**
linux:
  category: Utility
  executableName: pspore-desktop
  target:
    - dir
