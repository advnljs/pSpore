<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pSpore · Notification</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./notification.js"></script>
  </head>
  <body>
    <main class="card" role="status" aria-live="polite">
      <header><img src="../assets/pspore.svg" width="30" height="30" alt="" /><strong>pSpore</strong><span id="label"></span><time id="time"></time><button id="dismiss" class="close" type="button" aria-label="Dismiss">×</button></header>
      <section><div class="eyebrow"><span id="level"></span><span id="count"></span></div><h1 id="title"></h1><p id="body"></p></section>
      <footer><div class="source"><svg class="source-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3.5h10a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H8l-3 2.5v-2.5H3a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1Z" /><path d="M5 6.5h6M5 8.75h3.5" /></svg><span id="session"></span></div><button id="open" type="button"><span id="open-label"></span><span aria-hidden="true">↗</span></button></footer>
      <div class="timer" aria-hidden="true"><i></i></div>
    </main>
  </body>
</html>
