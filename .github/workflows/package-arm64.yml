name: Package Linux ARM64

on:
  workflow_call:
    inputs:
      expected_version:
        description: Package version required by the calling release workflow
        required: false
        type: string
        default: ""
      artifact_name:
        description: Override the uploaded artifact name
        required: false
        type: string
        default: ""
      release_tag:
        description: >-
          Upload the packages onto this release's assets instead of into a build
          artifact. Set by the release workflow; a preview build leaves it empty
          and keeps using an artifact.
        required: false
        type: string
        default: ""
      retention_days:
        description: Number of days to retain the uploaded packages
        required: false
        type: number
        default: 14
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/package-arm64.yml"
      - "electron-builder.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-cli-binary.sh"
      - "scripts/package-desktop.sh"
      - "scripts/electron-smoke.mjs"
      - "scripts/linux/**"
      - "src/**"
      - "test/**"
      - "tsconfig.json"
      - "tsconfig.build.json"

permissions:
  contents: write

concurrency:
  group: package-linux-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-arm64:
    name: Kylin V10 compatible ARM64 package
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:20.04
    timeout-minutes: 90
    env:
      CI: "true"
      DEBIAN_FRONTEND: noninteractive
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    # Every other job in this repository runs straight on a runner and gets bash.
    # This one runs in a container, where the runner falls back to `sh` (dash) —
    # so `set -o pipefail` aborted the release upload, and the `[[ ]]` version
    # guard below had been quietly failing open since the day it was written.
    defaults:
      run:
        shell: bash
    steps:
      - name: Install glibc 2.31 build and desktop runtime dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends --yes \
            binutils \
            build-essential \
            ca-certificates \
            curl \
            dbus-x11 \
            file \
            fonts-liberation \
            git \
            libasound2 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcairo2 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libglib2.0-0 \
            libgtk-3-0 \
            libnss3 \
            libpango-1.0-0 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libxss1 \
            libxtst6 \
            passwd \
            python3 \
            util-linux \
            xz-utils \
            xvfb

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify native ARM64 and Kylin-compatible libc baseline
        run: |
          test "$(uname -m)" = "aarch64"
          test "$(node -p 'process.arch')" = "arm64"
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.31"
          node --version
          npm --version
          gcc -dumpfullversion
          getconf GNU_LIBC_VERSION

      - name: Create unprivileged build user
        run: |
          useradd --create-home --user-group --shell /bin/bash pspore-builder
          install -d -m 0755 -o pspore-builder -g pspore-builder /home/pspore-builder/.cache
          install -d -m 0700 -o pspore-builder -g pspore-builder /home/pspore-builder/.runtime
          install -d -o pspore-builder -g pspore-builder /home/pspore-builder/.cache/electron
          install -d -o pspore-builder -g pspore-builder /home/pspore-builder/.cache/electron-builder
          install -d -o pspore-builder -g pspore-builder /home/pspore-builder/.npm
          chown -R pspore-builder:pspore-builder "$GITHUB_WORKSPACE"

      - name: Install native ARM64 dependencies
        run: |
          runuser -u pspore-builder -- env \
            HOME=/home/pspore-builder \
            PATH="$PATH" \
            XDG_CACHE_HOME=/home/pspore-builder/.cache \
            XDG_RUNTIME_DIR=/home/pspore-builder/.runtime \
            npm_config_cache=/home/pspore-builder/.npm \
            ELECTRON_CACHE=/home/pspore-builder/.cache/electron \
            npm ci
          runuser -u pspore-builder -- env \
            HOME=/home/pspore-builder \
            PATH="$PATH" \
            npm_config_cache=/home/pspore-builder/.npm \
            ELECTRON_CACHE=/home/pspore-builder/.cache/electron \
            node node_modules/electron/install.js
          test -d node_modules/@earendil-works/pi-coding-agent/node_modules/@mariozechner/clipboard-linux-arm64-gnu
          file node_modules/electron/dist/electron | grep -F "ARM aarch64"
          chown root:root node_modules/electron/dist/chrome-sandbox
          chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Typecheck, test, and build on ARM64
        run: |
          runuser -u pspore-builder -- env \
            HOME=/home/pspore-builder \
            PATH="$PATH" \
            npm_config_cache=/home/pspore-builder/.npm \
            ELECTRON_CACHE=/home/pspore-builder/.cache/electron \
            npm run check

      - name: Run Electron desktop smoke at the PC baseline
        run: |
          runuser -u pspore-builder -- env \
            HOME=/home/pspore-builder \
            PATH="$PATH" \
            XDG_CACHE_HOME=/home/pspore-builder/.cache \
            XDG_RUNTIME_DIR=/home/pspore-builder/.runtime \
            npm_config_cache=/home/pspore-builder/.npm \
            ELECTRON_CACHE=/home/pspore-builder/.cache/electron \
            PSPORE_ELECTRON_NO_SANDBOX=1 \
            PSPORE_ELECTRON_SMOKE_TIMEOUT_MS=180000 \
            dbus-run-session -- npm run test:electron

      - name: Upload Electron smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-electron-smoke-diagnostics-${{ github.run_attempt }}
          path: |
            /tmp/pspore-electron-smoke-*/smoke
            /tmp/pspore-electron-owned-smoke-*/smoke
          if-no-files-found: warn
          retention-days: 1

      - name: Package ARM64 desktop and standalone CLI
        id: package
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          # Bundled skill binaries come from a separate private repository that
          # the default GITHUB_TOKEN cannot read. Absent it, packaging still
          # succeeds and the skill ships without its binary.
          BUNDLED_BINARIES_TOKEN: ${{ secrets.BUNDLED_BINARIES_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ -n "$EXPECTED_VERSION" && "$VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "package.json version ${VERSION} does not match release version ${EXPECTED_VERSION}"
            exit 1
          fi
          runuser -u pspore-builder -- env \
            HOME=/home/pspore-builder \
            PATH="$PATH" \
            npm_config_cache=/home/pspore-builder/.npm \
            ELECTRON_CACHE=/home/pspore-builder/.cache/electron \
            ELECTRON_BUILDER_CACHE=/home/pspore-builder/.cache/electron-builder \
            GH_TOKEN="${BUNDLED_BINARIES_TOKEN:-}" \
            bash scripts/package-desktop.sh "$VERSION" arm64
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify ARM64 artifacts and checksums
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          CLI="release-dist/pspore-${VERSION}-linux-arm64"
          APP="release-dist/pspore-desktop-${VERSION}-linux-arm64/pspore-desktop"
          FULL_ZIP="release-dist/pspore-desktop-${VERSION}-linux-arm64.zip"
          OVERLAY_ZIP="release-dist/pspore-desktop-${VERSION}-linux-arm64-overlay.zip"
          test -x "$CLI"
          test -x "$APP"
          test -f "$FULL_ZIP"
          test -f "$OVERLAY_ZIP"
          file "$CLI" | grep -F "ARM aarch64"
          file "$APP" | grep -F "ARM aarch64"
          readelf --program-headers "$CLI" | grep -F "/lib/ld-linux-aarch64.so.1"
          readelf --program-headers "$APP" | grep -F "/lib/ld-linux-aarch64.so.1"
          env ELECTRON_RUN_AS_NODE=1 "$APP" -p '`${process.versions.electron}/${process.platform}/${process.arch}`' \
            | grep -F "43.3.0/linux/arm64"
          "$CLI" version
          "$CLI" --help >/dev/null
          (
            cd release-dist
            sha256sum --check "pspore-${VERSION}-linux-arm64.sha256"
            sha256sum --check "pspore-desktop-${VERSION}-linux-arm64.zip.sha256"
            sha256sum --check "pspore-desktop-${VERSION}-linux-arm64-overlay.zip.sha256"
          )

      # `gh` is preinstalled on the runner, not inside the container this job
      # builds in, so the release upload below found no such command. Pinned
      # rather than tracking latest: a release must not change because an
      # upstream tool moved.
      - name: Install the GitHub CLI inside the container
        if: inputs.release_tag != ''
        env:
          GH_CLI_VERSION: 2.100.0
        run: |
          TARBALL="gh_${GH_CLI_VERSION}_linux_arm64.tar.gz"
          curl -fsSL --retry 3 \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/${TARBALL}" \
            -o "/tmp/${TARBALL}"
          tar -xzf "/tmp/${TARBALL}" -C /tmp
          install -m 0755 "/tmp/gh_${GH_CLI_VERSION}_linux_arm64/bin/gh" /usr/local/bin/gh
          gh --version

      - name: Upload ARM64 assets to the draft release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          cd release-dist
          # Straight onto the draft: Actions storage is a metered 500 MB, and a
          # release of this size used to fill it and block every later release.
          # `--repo` keeps gh from resolving the repository through git, whose
          # ownership of this checkout differs from the user running this step.
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            "pspore-desktop-${VERSION}-linux-arm64.zip#ARM64 / Kylin V10 - Full desktop package" \
            "pspore-desktop-${VERSION}-linux-arm64.zip.sha256#ARM64 / Kylin V10 - Full desktop SHA-256" \
            "pspore-desktop-${VERSION}-linux-arm64-overlay.zip#ARM64 / Kylin V10 - Overlay upgrade" \
            "pspore-desktop-${VERSION}-linux-arm64-overlay.zip.sha256#ARM64 / Kylin V10 - Overlay SHA-256" \
            "pspore-${VERSION}-linux-arm64#ARM64 / Kylin V10 - Standalone CLI" \
            "pspore-${VERSION}-linux-arm64.sha256#ARM64 / Kylin V10 - CLI SHA-256" \
            --clobber

      # A preview download for whoever wants this commit's ARM64 build. The run's
      # verdict is the build and the smoke above, not this convenience upload, so
      # a full artifact store must not fail a build that actually passed — which
      # is exactly what blocked releasing once the 500 MB quota filled.
      - name: Upload ARM64 CI packages
        if: inputs.release_tag == ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name || format('pspore-{0}-linux-arm64-glibc-2.31', steps.package.outputs.version) }}
          path: |
            release-dist/pspore-${{ steps.package.outputs.version }}-linux-arm64
            release-dist/pspore-${{ steps.package.outputs.version }}-linux-arm64.sha256
            release-dist/pspore-desktop-${{ steps.package.outputs.version }}-linux-arm64.zip
            release-dist/pspore-desktop-${{ steps.package.outputs.version }}-linux-arm64.zip.sha256
            release-dist/pspore-desktop-${{ steps.package.outputs.version }}-linux-arm64-overlay.zip
            release-dist/pspore-desktop-${{ steps.package.outputs.version }}-linux-arm64-overlay.zip.sha256
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days || 2 }}
          compression-level: 0
