name: Release desktop

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-desktop:
    name: Build Linux desktop zips
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

      - name: Resolve package version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "full_zip=pspore-desktop-${VERSION}-linux-x64.zip" >> "$GITHUB_OUTPUT"
          echo "overlay_zip=pspore-desktop-${VERSION}-linux-x64-overlay.zip" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
              exit 1
            fi
          fi

      - name: Package desktop zips
        run: bash scripts/package-desktop.sh "${{ steps.version.outputs.version }}"

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          FULL_ZIP: ${{ steps.version.outputs.full_zip }}
          OVERLAY_ZIP: ${{ steps.version.outputs.overlay_zip }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          FULL_PATH="release-dist/${FULL_ZIP}"
          OVERLAY_PATH="release-dist/${OVERLAY_ZIP}"
          test -f "$FULL_PATH"
          test -f "$FULL_PATH.sha256"
          test -f "$OVERLAY_PATH"
          test -f "$OVERLAY_PATH.sha256"

          NOTES="$(printf '%s\n' \
            "Linux x86_64 desktop packages for pSpore ${TAG}." \
            "" \
            "### Full install" \
            "" \
            "\`${FULL_ZIP}\` contains the Electron runtime and a clickable \`创建桌面快捷方式.sh\`." \
            "" \
            "unzip ${FULL_ZIP}" \
            "cd pspore-desktop-${VERSION}-linux-x64" \
            "./创建桌面快捷方式.sh" \
            "" \
            "### Overlay upgrade" \
            "" \
            "\`${OVERLAY_ZIP}\` contains the verified app payload but no Electron/Chromium runtime." \
            "Extract it, then run \`./覆盖升级.sh /path/to/existing-install\`; incompatible runtimes are rejected before changes." \
            "" \
            "SHA-256 checksums: ${FULL_ZIP}.sha256 and ${OVERLAY_ZIP}.sha256" \
            "" \
            "The npm CLI remains p-spore; these release assets are the Electron desktop client.")"

          ASSETS=(
            "$FULL_PATH"
            "$FULL_PATH.sha256"
            "$OVERLAY_PATH"
            "$OVERLAY_PATH.sha256"
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing GitHub Release ${TAG}"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            echo "Creating GitHub Release ${TAG}"
            gh release create "$TAG" \
              --title "pSpore ${TAG}" \
              --notes "$NOTES" \
              --generate-notes \
              "${ASSETS[@]}"
          fi

          gh release view "$TAG"
