name: Release desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-desktop:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse2

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

      - name: Resolve package version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "appimage=pspore-desktop-${VERSION}-linux-x64.AppImage" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
              exit 1
            fi
          fi

      - name: Package desktop AppImage
        run: bash scripts/package-desktop.sh "${{ steps.version.outputs.version }}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.appimage }}
          path: |
            release-dist/${{ steps.version.outputs.appimage }}
            release-dist/${{ steps.version.outputs.appimage }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: pSpore ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release-dist/${{ steps.version.outputs.appimage }}
            release-dist/${{ steps.version.outputs.appimage }}.sha256
          body: |
            ## Desktop

            Linux x86_64 AppImage: `${{ steps.version.outputs.appimage }}`

            ```bash
            chmod +x ${{ steps.version.outputs.appimage }}
            ./${{ steps.version.outputs.appimage }}
            ```

            SHA-256 checksum: `${{ steps.version.outputs.appimage }}.sha256`

            The npm CLI remains `p-spore`; this release asset is the Electron desktop client.
