name: Release desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate immutable release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve and validate package version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != v* ]]; then
            echo "Immutable releases must run from a v* tag, not ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}"
            exit 1
          fi
          TAG_REF="refs/tags/${GITHUB_REF_NAME}"
          REMOTE_TAG_OBJECT="$(git ls-remote --tags origin "$TAG_REF" | awk 'NR == 1 { print $1 }')"
          REMOTE_PEELED_COMMIT="$(git ls-remote --tags origin "${TAG_REF}^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$REMOTE_TAG_OBJECT" || -z "$REMOTE_PEELED_COMMIT" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} must be annotated"
            exit 1
          fi
          if [[ "$REMOTE_PEELED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not point to workflow commit ${GITHUB_SHA}"
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" != "$VERSION" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Open the draft release the build jobs upload into
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Assets go straight onto a draft instead of through build artifacts:
          # Actions storage is a metered 500 MB, and one release of this size
          # filled it, which failed every subsequent release until it was purged.
          # A draft is invisible until the publish job verifies both halves.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            if [[ "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "Release ${GITHUB_REF_NAME} is already published; refusing to overwrite it"
              exit 1
            fi
            # A re-run starts from a clean draft so a stale asset cannot survive.
            gh release delete "${GITHUB_REF_NAME}" --yes
          fi
          gh release create "${GITHUB_REF_NAME}" --draft --title "pSpore ${GITHUB_REF_NAME}" --notes "Build in progress."

  package-x64:
    name: Build Linux x64 release assets
    needs: validate-release
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: Install native startup build and test dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes libgtk-3-dev pkg-config xvfb x11-utils xdotool

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

      - name: Build and test native startup on glibc 2.31
        run: bash scripts/build-native-startup-container.sh "$RUNNER_TEMP/pspore-startup"

      - name: Package x64 desktop and standalone CLI
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
          PSPORE_NATIVE_STARTUP_BINARY: ${{ runner.temp }}/pspore-startup
          # Bundled skill binaries live in a separate private repository, which
          # the default GITHUB_TOKEN cannot read. Without this the packaging step
          # still succeeds and the skill simply ships without its binary.
          GH_TOKEN: ${{ secrets.BUNDLED_BINARIES_TOKEN || github.token }}
        run: bash scripts/package-desktop.sh "$VERSION" x64

      - name: Verify native startup before Electron
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: xvfb-run -a -s "-screen 0 1920x1080x24" node scripts/native-startup-smoke.mjs "release-dist/pspore-desktop-${VERSION}-linux-x64/resources/native/pspore-startup"

      - name: Verify x64 artifacts and checksums
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          set -euo pipefail
          CLI="release-dist/pspore-${VERSION}-linux-x64"
          APP="release-dist/pspore-desktop-${VERSION}-linux-x64/pspore-desktop"
          FULL_ZIP="release-dist/pspore-desktop-${VERSION}-linux-x64.zip"
          OVERLAY_ZIP="release-dist/pspore-desktop-${VERSION}-linux-x64-overlay.zip"
          test -x "$CLI"
          test -x "$APP"
          test -f "$FULL_ZIP"
          test -f "$OVERLAY_ZIP"
          file "$CLI" | grep -F "x86-64"
          file "$APP" | grep -F "x86-64"
          test -x "${APP%/pspore-desktop}/resources/native/pspore-startup"
          file "${APP%/pspore-desktop}/resources/native/pspore-startup" | grep -F "x86-64"
          readelf --program-headers "$CLI" | grep -F "/lib64/ld-linux-x86-64.so.2"
          env ELECTRON_RUN_AS_NODE=1 "$APP" -p '`${process.versions.electron}/${process.platform}/${process.arch}`' \
            | grep -F "43.3.0/linux/x64"
          "$CLI" version
          "$CLI" --help >/dev/null
          (
            cd release-dist
            sha256sum --check "pspore-${VERSION}-linux-x64.sha256"
            sha256sum --check "pspore-desktop-${VERSION}-linux-x64.zip.sha256"
            sha256sum --check "pspore-desktop-${VERSION}-linux-x64-overlay.zip.sha256"
          )

      - name: Upload x64 assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          set -euo pipefail
          cd release-dist
          gh release upload "${GITHUB_REF_NAME}" \
            "pspore-desktop-${VERSION}-linux-x64.zip#x86_64 - Full desktop package" \
            "pspore-desktop-${VERSION}-linux-x64.zip.sha256#x86_64 - Full desktop SHA-256" \
            "pspore-desktop-${VERSION}-linux-x64-overlay.zip#x86_64 - Overlay upgrade" \
            "pspore-desktop-${VERSION}-linux-x64-overlay.zip.sha256#x86_64 - Overlay SHA-256" \
            "pspore-${VERSION}-linux-x64#x86_64 - Standalone CLI" \
            "pspore-${VERSION}-linux-x64.sha256#x86_64 - CLI SHA-256" \
            --clobber

  package-arm64:
    name: Build Kylin-compatible ARM64 release assets
    needs: validate-release
    uses: ./.github/workflows/package-arm64.yml
    # A called workflow's permissions are capped by the caller's, and this one
    # uploads its assets onto the draft release rather than into an artifact.
    permissions:
      contents: write
    # A reusable workflow receives no secrets unless they are passed; the ARM
    # packaging needs the same read access to the bundled-binaries repository.
    secrets: inherit
    with:
      expected_version: ${{ needs.validate-release.outputs.version }}
      release_tag: ${{ github.ref_name }}

  publish-release:
    name: Publish immutable dual-architecture Release
    needs:
      - validate-release
      - package-x64
      - package-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download the draft's assets for verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-dist
          # Downloading from the draft rather than from build artifacts: the
          # bytes being verified are then exactly the bytes that will publish.
          gh release download "${GITHUB_REF_NAME}" --dir release-dist --clobber

      - name: Verify and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          # Every asset must be present and match its own checksum before any of
          # this becomes visible; the draft is what makes that possible.
          for ARCH in arm64 x64; do
            CLI="pspore-${VERSION}-linux-${ARCH}"
            FULL_ZIP="pspore-desktop-${VERSION}-linux-${ARCH}.zip"
            OVERLAY_ZIP="pspore-desktop-${VERSION}-linux-${ARCH}-overlay.zip"
            for FILE in "$CLI" "$CLI.sha256" "$FULL_ZIP" "$FULL_ZIP.sha256" "$OVERLAY_ZIP" "$OVERLAY_ZIP.sha256"; do
              test -f "release-dist/${FILE}"
            done
            (
              cd release-dist
              sha256sum --check "${CLI}.sha256"
              sha256sum --check "${FULL_ZIP}.sha256"
              sha256sum --check "${OVERLAY_ZIP}.sha256"
            )
          done
          file "release-dist/pspore-${VERSION}-linux-x64" | grep -F "x86-64"
          file "release-dist/pspore-${VERSION}-linux-arm64" | grep -F "ARM aarch64"

          NOTES="$(printf '%s\n' \
            "Linux ARM64 and x86_64 desktop packages for pSpore ${TAG}. Assets are labeled by architecture below." \
            "" \
            "### ARM64 / Kylin V10" \
            "" \
            "- Full install: \`pspore-desktop-${VERSION}-linux-arm64.zip\`" \
            "- Overlay upgrade: \`pspore-desktop-${VERSION}-linux-arm64-overlay.zip\`" \
            "- Standalone CLI: \`pspore-${VERSION}-linux-arm64\`" \
            "" \
            "Built natively on AArch64 against an Ubuntu 20.04 / glibc 2.31 userspace baseline." \
            "" \
            "### x86_64" \
            "" \
            "- Full install: \`pspore-desktop-${VERSION}-linux-x64.zip\`" \
            "- Overlay upgrade: \`pspore-desktop-${VERSION}-linux-x64-overlay.zip\`" \
            "- Standalone CLI: \`pspore-${VERSION}-linux-x64\`" \
            "" \
            "### Install and upgrade" \
            "" \
            "For a full install, extract the matching full zip and run the included \`创建桌面快捷方式.sh\`." \
            "The matching overlay zip contains the verified app payload but no Electron/Chromium runtime." \
            "Extract it, then run \`./覆盖升级.sh /path/to/existing-install\`; incompatible Electron versions or architectures are rejected before changes." \
            "" \
            "A separately labeled SHA-256 file is provided for every asset." \
            "The npm CLI remains p-spore; these Release assets include the Electron desktop client.")"

          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]]; then
            echo "Refusing to overwrite immutable GitHub Release ${TAG}; bump the SemVer version first."
            exit 1
          fi
          EDIT_FLAGS=()
          if [[ "$VERSION" == *-* ]]; then
            EDIT_FLAGS+=(--prerelease)
          fi
          # Undrafting is the publish: until now nothing was visible, and the
          # assets it makes visible are the ones just verified above.
          gh release edit "$TAG" \
            --title "pSpore ${TAG}" \
            --notes "$NOTES" \
            --draft=false \
            "${EDIT_FLAGS[@]}"

          gh release view "$TAG"
