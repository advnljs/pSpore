name: Release desktop

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-desktop:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse2

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

      - name: Resolve package version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "appimage=pspore-desktop-${VERSION}-linux-x64.AppImage" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
              exit 1
            fi
          fi

      - name: Package desktop AppImage
        run: bash scripts/package-desktop.sh "${{ steps.version.outputs.version }}"

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          APPIMAGE: ${{ steps.version.outputs.appimage }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          APPIMAGE_PATH="release-dist/${APPIMAGE}"
          CHECKSUM_PATH="release-dist/${APPIMAGE}.sha256"
          test -f "$APPIMAGE_PATH"
          test -f "$CHECKSUM_PATH"

          NOTES="$(printf '%s\n' \
            "Linux x86_64 AppImage: ${APPIMAGE}" \
            "" \
            "chmod +x ${APPIMAGE}" \
            "./${APPIMAGE}" \
            "" \
            "SHA-256: ${APPIMAGE}.sha256" \
            "" \
            "The npm CLI remains p-spore; this release asset is the Electron desktop client.")"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing GitHub Release ${TAG}"
            gh release upload "$TAG" "$APPIMAGE_PATH" "$CHECKSUM_PATH" --clobber
          else
            echo "Creating GitHub Release ${TAG}"
            gh release create "$TAG" \
              --title "pSpore ${TAG}" \
              --notes "$NOTES" \
              --generate-notes \
              "$APPIMAGE_PATH" \
              "$CHECKSUM_PATH"
          fi

          gh release view "$TAG"
